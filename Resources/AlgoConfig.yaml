    ALGO_CODE: 0
    ALGO_NAME: "AlgoTester"
    ALGO_MAYUS_LETTERS: "AT"
    ALGO_PUBLIC_NAME: "GeorgeWashington"
    ALGO_VERSION: "1.0"
